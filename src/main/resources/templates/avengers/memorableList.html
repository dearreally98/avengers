<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>기억에 남는 명대사</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <section layout:fragment="content">
        <div class="container my-4 mx-auto text-center" style="max-width: 800px;">
            <h3>기억에 남는 명대사, 무엇인가요?</h3>

            <form th:action="@{/avengers/memorableList}" method="post" class="mb-3">
                <div class="card border shadow-sm">
                    <div class="card-body p-0 d-flex">
                        <div class="flex-grow-1">
                            <input type="text" name="titleDTO" class="form-control form-control-sm border-0 border-bottom rounded-0 py-2 px-3" placeholder="명대사를 입력해주세요." required>
                            <input type="text" name="contentDTO" class="form-control form-control-sm border-0 py-2 px-3 text-secondary x-small" placeholder="추가설명이 있을 경우 입력">
                        </div>
                        <button type="submit" class="btn btn-purple btn-sm px-3 fw-bold rounded-end-2 rounded-start-0" style="white-space: nowrap;">등록</button>
                    </div>
                    <div class="border-bottom">
                        <select name="characterActorNameDTO" class="form-select form-select-sm border-0 py-2 px-3 fw-bold text-dark" style="background-color: #f8f9fa;" required>
                            <option value="" selected disabled>-- 캐릭터 / 배우를 선택하세요 --</option>
                            <option value="토니 스타크 / 아이언맨 (로버트 다우니 주니어)">토니 스타크 / 아이언맨 (로버트 다우니 주니어)</option>
                            <option value="스티브 로저스 / 캡틴 아메리카 (크리스 에반스)">스티브 로저스 / 캡틴 아메리카 (크리스 에반스)</option>
                            <option value="토르 (크리스 헴스워스)">토르 (크리스 헴스워스)</option>
                            <option value="브루스 배너 / 헐크 (마크 러팔로)">브루스 배너 / 헐크 (마크 러팔로)</option>
                            <option value="나타샤 로마노프 / 블랙 위도우 (스칼렛 요한슨)">나타샤 로마노프 / 블랙 위도우 (스칼렛 요한슨)</option>
                            <option value="클린트 바튼 / 호크아이 (제레미 레너)">클린트 바튼 / 호크아이 (제레미 레너)</option>
                        </select>
                    </div>
                </div>


            </form>

            <!-- 2. 카드 리스트 영역 -->
            <div class="d-flex flex-column gap-3">
                <div th:each="memorable : ${memorableList}" th:object="${memorable}" class="card border shadow-sm rounded-4 bg-white overflow-hidden">
                    <div class="card-body p-4 position-relative">
                        <div class="position-absolute end-0 top-0 pe-3 pt-3 d-flex gap-1">
                            <!-- 수정 버튼 -->
                            <a href="#" class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center border-0 p-0" style="width: 32px; height: 32px; opacity: 0.7; transition: all 0.2s;" onmouseover="this.style.opacity='1'; this.style.backgroundColor='#f1f3f5';" onmouseout="this.style.opacity='0.7'; this.style.backgroundColor='transparent';" title="수정">
                                <i class="bi bi-pencil-fill" style="font-size: 0.85rem;">수정</i>
                            </a>

                            <!-- 삭제 버튼 -->
                            <form th:action="@{/avengers/memorableDelete}" method="post" >
                                <input type="hidden" name="no" th:value="*{noDTO}">
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-circle d-flex align-items-center justify-content-center border-0 p-0" style="width: 32px; height: 32px; opacity: 0.7; transition: all 0.2s;" onmouseover="this.style.opacity='1'; this.style.backgroundColor='#ffe3e3';" onmouseout="this.style.opacity='0.7'; this.style.backgroundColor='transparent';" onclick="return confirm('정말 삭제하시겠습니까?');" title="삭제">
                                    삭제
                                </button>
                            </form>

                        </div>
                        <div class="mb-3 text-start">
                            <strong class="fs-6" style="color: #6b4776;" th:text="*{characterActorNameDTO}">캐릭터 이름</strong>
                        </div>
                        <div class="text-center my-3 py-2">
                            <div class="fw-bold text-dark fs-5 mb-1">
                                <span>"</span>
                                <span th:text="*{titleDTO}">명대사</span>
                                <span>"</span>
                            </div>
                            <p class="text-secondary small mb-0" th:text="*{contentDTO}">부연설명</p>
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-3 mt-2 border-top">
                            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3 py-1">
                                <i class="bi bi-hand-thumbs-up me-1"></i>
                                <span th:text="*{goodDTO}">0</span>
                            </button>
                            <div class="text-muted" style="font-size: 0.75rem;">
                                <span class="mx-1">·</span>
                                <span th:text="${#temporals.format(memorable.createTimeDTO, 'yyyy-MM-dd')}">작성일</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
