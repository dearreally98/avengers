<!doctype html>
<html
        lang="ko"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">출연진 및 제작진</title>

    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/cast.css}" />
    </th:block>
</head>

<body>
<th:block layout:fragment="content">
    <div class="cast-container">
        <header class="cast-header">
            <h1>출연진 및 제작진</h1>
            <p>어벤저스의 주요 출연진과 제작진을 확인할 수 있습니다.</p>
        </header>

        <!-- 검색 영역 -->
        <section class="cast-search-area">
            <form
                    class="cast-search-form"
                    th:action="@{/cast}"
                    method="get"
                    role="search"
            >
                <input
                        class="cast-search-input"
                        type="search"
                        name="keyword"
                        th:value="${keyword}"
                        placeholder="인물 이름, 배역 또는 담당 업무 검색"
                        aria-label="출연진 및 제작진 검색"
                />

                <button class="cast-search-button" type="submit">
                    검색
                </button>

                <a
                        class="cast-reset-button"
                        th:href="@{/cast}"
                        th:if="${keyword != null and !keyword.isBlank()}"
                >
                    초기화
                </a>
            </form>
        </section>

        <!-- 검색 결과 없음 -->
        <section
                class="empty-result"
                th:if="${#lists.isEmpty(actorList) and #lists.isEmpty(crewList)}"
        >
            <p
                    th:if="${keyword != null and !keyword.isBlank()}"
                    th:text="|‘${keyword}’에 대한 검색 결과가 없습니다.|"
            >
                검색 결과가 없습니다.
            </p>

            <p th:unless="${keyword != null and !keyword.isBlank()}">
                등록된 출연진 및 제작진이 없습니다.
            </p>
        </section>

        <!-- 출연진 영역 -->
        <section
                class="cast-section"
                th:if="${!#lists.isEmpty(actorList)}"
        >
            <div class="cast-section-title">
                <h2>출연진</h2>
                <span
                        class="cast-count"
                        th:text="|총 ${actorList.size()}명|"
                >
              총 0명
            </span>
            </div>

            <div class="cast-list">
                <article
                        class="cast-card"
                        th:each="actor : ${actorList}"
                        th:id="|cast-${actor.castId}|"
                >
                    <div class="cast-image-area">
                        <img
                                class="cast-image"
                                th:src="${actor.imagePath}"
                                th:alt="|${actor.castName} 사진|"
                        />
                    </div>

                    <div class="cast-info">
                        <h3
                                class="cast-name"
                                th:text="${actor.castName}"
                        >
                            배우 이름
                        </h3>

                        <p
                                class="cast-role"
                                th:text="${actor.roleName}"
                        >
                            배역
                        </p>
                    </div>
                </article>
            </div>
        </section>

        <!-- 제작진 영역 -->
        <section
                class="cast-section"
                th:if="${!#lists.isEmpty(crewList)}"
        >
            <div class="cast-section-title">
                <h2>제작진</h2>
                <span
                        class="cast-count"
                        th:text="|총 ${crewList.size()}명|"
                >
              총 0명
            </span>
            </div>

            <div class="cast-list">
                <article
                        class="cast-card"
                        th:each="crew : ${crewList}"
                        th:id="|cast-${crew.castId}|"
                >
                    <div class="cast-image-area">
                        <img
                                class="cast-image"
                                th:src="${crew.imagePath}"
                                th:alt="|${crew.castName} 사진|"
                        />
                    </div>

                    <div class="cast-info">
                        <h3
                                class="cast-name"
                                th:text="${crew.castName}"
                        >
                            제작진 이름
                        </h3>

                        <p
                                class="cast-role"
                                th:text="${crew.roleName}"
                        >
                            담당 업무
                        </p>
                    </div>
                </article>
            </div>
        </section>
    </div>
</th:block>
</body>
</html>
