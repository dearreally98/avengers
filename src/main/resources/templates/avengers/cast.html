<!doctype html>
<html
        lang="ko"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout}"
>
<head>
    <title layout:fragment="title">출연진 및 제작진</title>

    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/cast.css}"/>
    </th:block>
</head>

<body>
<section layout:fragment="content" class="my-4">
    <h1 class="title">출연진 및 제작진</h1>

    <!-- 검색 영역 -->
    <form th:action="@{/avengers/cast}" method="get" role="search">
        <div class="field has-addons mb-4">
            <div class="control is-expanded">
                <input
                        type="search"
                        name="keyword"
                        class="input"
                        th:value="${keyword}"
                        placeholder="인물 이름, 배역 또는 담당 업무 검색"
                        aria-label="출연진 및 제작진 검색"
                />
            </div>

            <div class="control">
                <button type="submit" class="button is-link">
                    검색
                </button>

                <a
                        th:href="@{/avengers/cast}"
                        class="button is-link is-outlined"
                        th:if="${keyword != null and !keyword.isBlank()}"
                >
                    전체목록
                </a>
            </div>
        </div>
    </form>

    <!-- 검색 결과 없음 -->
    <div
            class="alert alert-light border text-center py-5 my-4"
            th:if="${#lists.isEmpty(actorList) and #lists.isEmpty(crewList)}"
    >
        <p
                class="mb-0"
                th:if="${keyword != null and !keyword.isBlank()}"
                th:text="|‘${keyword}’에 대한 검색 결과가 없습니다.|"
        >
            검색 결과가 없습니다.
        </p>

        <p
                class="mb-0"
                th:unless="${keyword != null and !keyword.isBlank()}"
        >
            등록된 출연진 및 제작진이 없습니다.
        </p>
    </div>

    <!-- 출연진 영역 -->
    <section
            class="mb-5"
            th:if="${!#lists.isEmpty(actorList)}"
    >
        <div
                class="d-flex align-items-center justify-content-between mb-3"
        >
            <h2 class="title is-4 mb-0">주연</h2>

            <span
                    class="text-secondary"
                    th:text="|${actorList.size()}명|"
            >
            0명
          </span>
        </div>

        <div
                class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3 mb-4"
        >
            <div
                    class="col"
                    th:each="actor : ${actorList}"
            >
                <article
                        class="card h-100 border-0 shadow-sm rounded-3 overflow-hidden"
                        th:id="|cast-${actor.castId}|"
                >
                    <img
                            th:src="${actor.imagePath != null and !#strings.isEmpty(actor.imagePath)
    ? actor.imagePath
    : '/image/cast/default-profile.jpg'}"
                            onerror="this.onerror=null; this.src='/image/cast/default-profile.jpg';"
                            class="card-img-top cast-person-image"
                            th:alt="|${actor.castName} 사진|"
                    />

                    <div class="card-body p-2 text-center bg-white">
                        <h3
                                class="card-text fw-bold text-truncate mb-1 cast-person-name"
                                th:text="${actor.castName}"
                        >
                            배우 이름
                        </h3>

                        <p
                                class="card-text text-secondary small mb-0 cast-person-role"
                                th:text="${actor.roleName}"
                        >
                            배역
                        </p>
                    </div>
                </article>
            </div>
        </div>
    </section>

    <!-- 제작진 영역 -->
    <section
            class="mb-5"
            th:if="${!#lists.isEmpty(crewList)}"
    >
        <div
                class="d-flex align-items-center justify-content-between mb-3"
        >
            <h2 class="title is-4 mb-0">제작진</h2>

            <span
                    class="text-secondary"
                    th:text="|${crewList.size()}명|"
            >
            0명
          </span>
        </div>

        <div
                class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3 mb-4"
        >
            <div
                    class="col"
                    th:each="crew : ${crewList}"
            >
                <article
                        class="card h-100 border-0 shadow-sm rounded-3 overflow-hidden"
                        th:id="|cast-${crew.castId}|"
                >
                    <img
                            th:src="${crew.imagePath != null and !#strings.isEmpty(crew.imagePath)
    ? crew.imagePath
    : '/image/cast/default-profile.jpg'}"
                            onerror="this.onerror=null; this.src='/image/cast/default-profile.jpg';"
                            class="card-img-top cast-person-image"
                            th:alt="|${crew.castName} 사진|"
                    />

                    <div class="card-body p-2 text-center bg-white">
                        <h3
                                class="card-text fw-bold text-truncate mb-1 cast-person-name"
                                th:text="${crew.castName}"
                        >
                            제작진 이름
                        </h3>

                        <p
                                class="card-text text-secondary small mb-0 cast-person-role"
                                th:text="${crew.roleName}"
                        >
                            담당 업무
                        </p>
                    </div>
                </article>
            </div>
        </div>
    </section>
</section>
</body>
</html>
