<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>어벤저스 영화 리뷰 수정 페이지</title>
</head>
<body>
    <th:section layout:fragment="content">
        <div class="bg-dark text-light p-3 d-flex justify-content-between align-items-center mt-1">
            <h3>리뷰 게시판</h3>
        </div>

        <form id="updateForm" th:action="@{/review/{reviewNo}/update(reviewNo=*{reviewNo})}"
              th:object="${review}" method="post">
            <input type="hidden" name="reviewNo" th:value="*{reviewNo}">

            <div class="container-fluid mt-3">
                <input type="text" class="form-control" id="updateName" th:field="*{reviewName}" readonly>
                <input type="text" class="form-control mt-2" id="updateTitle" th:field="*{reviewTitle}">
                <div class="invalid-feedback">
                    제목을 입력해 주세요.
                </div>
                <div class="mt-2 text-secondary d-flex justify-content-between">
                    <span>
                        작성일 : <span th:text="${#temporals.format(review.reviewCreateAt, 'yyyy-MM-dd')}"></span>
                    </span>
                    <span>
                        조회수 : <span th:text="${review.reviewHit}"></span>
                    </span>
                </div>
                <textarea class="form-control mt-4" id="updateContent" rows="10" th:field="*{reviewContent}"></textarea>

                <div class="mt-3 d-flex justify-content-between align-items-center">
                    <div class="input-group w-25">
                        <span class="input-group-text">비밀번호</span>
                        <input type="password" class="form-control" name="reviewPassword">
                    </div>
                    <div class="d-flex">
                        <button type="submit" id="updateBtn" class="btn btn-outline-success">수정</button>
                        <button type="reset" id="cancelBtn" class="btn btn-outline-warning ms-2">수정취소</button>
                        <a class="btn btn-outline-secondary ms-2" th:href="@{/review/list}">목록</a>
                    </div>
                </div>
            </div>
        </form>
    </th:section>
</body>

<th:block layout:fragment="script">
    <script th:src="@{/js/avengers/common.js}" defer></script>
</th:block>
</html>
