<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title layout:fragment="title">추천 영화 목록</title>
</head>

<body>
<div layout:fragment="content" class="my-4">

    <!-- 1. 타이틀 및 검색바 영역 -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="fw-bold m-0">추천 영화</h2>

        <!-- 검색 폼 (GET 방식 - /avengers/recommend/list) -->
        <form th:action="@{/avengers/recommend/list}" method="get" class="d-flex gap-2">
            <!-- 검색 조건 선택 (DTO의 searchType 필드 사용) -->
            <select name="searchType" class="form-select form-select-sm" style="width: auto;">
                <option value="t" th:selected="${pageRequestDTO != null and pageRequestDTO.searchType == 't'}">영화제목</option>
                <option value="c" th:selected="${pageRequestDTO != null and pageRequestDTO.searchType == 'c'}">출연/감독</option>
            </select>

            <!-- 검색어 입력창 (DTO의 keyword 필드 사용) -->
            <input type="text"
                   name="keyword"
                   class="form-control form-control-sm"
                   placeholder="검색어를 입력하세요"
                   th:value="${pageRequestDTO != null ? pageRequestDTO.keyword : ''}"
                   style="width: 200px;">

            <!-- 검색 및 초기화 버튼 -->
            <button type="submit" class="btn btn-sm btn-primary text-nowrap">검색</button>
            <a th:href="@{/avengers/recommend/list}" class="btn btn-sm btn-outline-secondary text-nowrap">초기화</a>
        </form>
    </div>

    <!-- 2. 부트스트랩 카드 그리드 (한 줄에 5개씩) -->
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 mb-5">

        <!-- 검색 결과가 없을 때 표시 (totalCount 사용) -->
        <div class="col-12 text-center py-5" th:if="${responseDTO == null or responseDTO.totalCount == 0}">
            <p class="text-secondary fs-5 m-0">검색 결과가 존재하지 않습니다.</p>
        </div>

        <!-- RecommendMovieDTO 객체 순회 -->
        <div class="col" th:each="movie : ${responseDTO.dtoList}">
            <div class="card h-100 shadow-sm border-0 position-relative">

                <!-- 포스터 이미지 영역 -->
                <div class="ratio ratio-2x3 bg-light rounded-top overflow-hidden">
                    <img th:src="@{'/upload/' + ${movie.postUrl != null ? movie.postUrl : movie.savedFilename}}"
                         class="card-img-top object-fit-cover"
                         th:alt="${movie.movieName}">
                </div>

                <!-- 카드 본문 -->
                <div class="card-body p-2 text-center">
                    <a th:href="@{'/avengers/recommend/detail/' + ${movie.movieNo}(page=${pageRequestDTO != null ? pageRequestDTO.page : 1}, searchType=${pageRequestDTO != null ? pageRequestDTO.searchType : ''}, keyword=${pageRequestDTO != null ? pageRequestDTO.keyword : ''})}"
                       class="text-decoration-none text-dark stretched-link">
                        <p class="card-title fw-bold text-truncate m-0"
                           th:text="${movie.movieName}"
                           th:title="${movie.movieName}">
                            영화 제목
                        </p>
                    </a>
                </div>

            </div>
        </div>

    </div>

    <!-- 3. 페이징 영역 (PageResponseDTO의 pageNumberList, prevPage, nextPage 사용) -->
    <nav th:if="${responseDTO != null and responseDTO.totalCount > 0}" aria-label="Page navigation">
        <ul class="pagination justify-content-center">

            <!-- 이전 버튼 -->
            <li class="page-item" th:classappend="${!responseDTO.prev} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/avengers/recommend/list(page=${responseDTO.prevPage}, searchType=${pageRequestDTO != null ? pageRequestDTO.searchType : ''}, keyword=${pageRequestDTO != null ? pageRequestDTO.keyword : ''})}"
                   aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <!-- 페이지 번호 목록 직접 순회 (pageNumberList 사용) -->
            <li class="page-item"
                th:each="num : ${responseDTO.pageNumberList}"
                th:classappend="${responseDTO.currentPage == num} ? 'active'">
                <a class="page-link"
                   th:href="@{/avengers/recommend/list(page=${num}, searchType=${pageRequestDTO != null ? pageRequestDTO.searchType : ''}, keyword=${pageRequestDTO != null ? pageRequestDTO.keyword : ''})}"
                   th:text="${num}">1</a>
            </li>

            <!-- 다음 버튼 -->
            <li class="page-item" th:classappend="${!responseDTO.next} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/avengers/recommend/list(page=${responseDTO.nextPage}, searchType=${pageRequestDTO != null ? pageRequestDTO.searchType : ''}, keyword=${pageRequestDTO != null ? pageRequestDTO.keyword : ''})}"
                   aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

        </ul>
    </nav>

</div>
</body>
</html>
